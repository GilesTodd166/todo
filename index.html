l-element"><label class="label-text" for="task-comments">Comments:</label> <textarea id="task-comments" name="task-comments" type="text" maxlength="300"></textarea></div><div class="modal-element"><div id="modal-comments"><label class="label-text" for="task-comments">Saved Comments:</label></div></div><div class="modal-element"><button class="modal-save-btn" type="submit">Save</button> <button class="delete-btn task-delete" type="button">Delete</button></div></form></div></div><div class="project-modal"><div class="modal-content"><div class="modal-header"><h1>Add Project</h1><img id="closeIcon" class="settings-icon" src="./277eba015eb32b404579.svg" height="16px"></div><div class="modal-line"></div><form id="project-form" onsubmit="return!1"><div class="modal-element"><label class="label-text" for="task-name" autofocus>Project Name:</label> <input id="project-name" name="project-name" required></div><div class="modal-element"><button class="project-save-btn" type="submit">Save</button> <button class="delete-btn" type="button">Delete</button></div></form></div></div><div class="tag-modal"><div class="modal-content"><div class="modal-header"><h1>Add Tag</h1><img id="closeIcon" class="settings-icon" src="./277eba015eb32b404579.svg" height="16px"></div><div class="modal-line"></div><form id="tag-form" onsubmit="return!1"><div class="modal-element"><label class="label-text" for="tag-name" autofocus>Tag Name:</label> <input id="tag-name" name="tag-name" required></div><div class="modal-element"><button class="tag-save-btn" type="submit">Save</button> <button class="delete-btn" type="button">Delete</button></div></form></div></div></body></html>
